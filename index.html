<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one-screen toy app — a fixed cartoon sky/garden world behind, a top toy-bar, stacked screens that swap in place. Single bright daytime world by design. */
:root{
  --sky1:#62BDF3; --sky2:#C4ECFF; --grass:#8BDA5E; --grass2:#5EBB45; --grass3:#4AA33A;
  --ink:#283659; --ink-soft:#5B6B8E; --paper:#FFFFFF; --cream:#FFF7E3; --line:#E3EAF5;
  --coral:#FF6B6B; --sun:#FFC83D; --orange:#FF9A3C; --mint:#22C3A0; --grape:#8E5BD8; --berry:#FF5FA2; --blue:#3A86FF; --leaf:#4CC35A;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --ui:"Tajawal","Baloo Bhaijaan 2",system-ui,sans-serif;
  --shadow:0 6px 0 rgba(40,54,89,.10),0 16px 34px rgba(40,54,89,.16);
  --shadow-sm:0 4px 0 rgba(40,54,89,.10),0 8px 18px rgba(40,54,89,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;direction:rtl}
body{height:100%;margin:0;background:var(--sky2);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
svg{display:block}

/* ---------- background world ---------- */
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%);overflow:hidden;pointer-events:none}
#bg .sun{position:absolute;top:4%;left:5%;width:clamp(80px,12vw,150px);aspect-ratio:1;max-width:100%}
#bg .sun .rays{transform-origin:50% 50%;animation:spin 40s linear infinite}
#bg .cloud{position:absolute;opacity:.95;animation:drift linear infinite}
#bg .c1{top:9%;width:180px;animation-duration:70s;animation-delay:-20s}
#bg .c2{top:24%;width:120px;animation-duration:95s;animation-delay:-60s;opacity:.8}
#bg .c3{top:4%;width:140px;animation-duration:85s;animation-delay:-5s;opacity:.85}
#bg .c4{top:40%;width:100px;animation-duration:110s;animation-delay:-40s;opacity:.7}
#bg .spark{position:absolute;width:18px;height:18px;animation:twinkle 3s ease-in-out infinite}
#bg .hills{position:absolute;bottom:0;left:0;width:100%;height:22vh;min-height:110px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(20deg);opacity:1}}

/* ---------- app frame ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px;flex:0 0 auto}
#bar[hidden]{display:none!important}
.round-btn{width:56px;height:56px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:transform .15s}
.round-btn:active{transform:scale(.92)}
.round-btn svg{width:30px;height:30px}
.bar-end{display:flex;align-items:center;gap:10px}
.bar-mid{flex:1;min-width:0;text-align:center;font-weight:800;font-size:clamp(18px,3vw,26px);color:var(--paper);text-shadow:0 2px 0 rgba(40,54,89,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars-pill{display:flex;align-items:center;gap:6px;height:56px;padding-inline:14px 18px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow-sm);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.stars-pill svg{width:34px;height:34px}
.stars-pill.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.gear{position:relative}
.gear::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent}
.gear.holding::after{border-color:var(--sun);animation:hold .9s linear forwards;clip-path:inset(0 0 100% 0)}
@keyframes hold{to{clip-path:inset(0 0 0 0)}}
.gear.holding svg{animation:spin 1s linear infinite}
#homeBtn.invisible{visibility:hidden}

main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.enter{animation:screenIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(24px) scale(.97)}}

/* ---------- start ---------- */
#scrStart{align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:20px 16vh;overflow-y:auto}
.logo{font-weight:800;font-size:clamp(44px,9vw,104px);line-height:1.15;margin:0;text-wrap:balance;
  text-shadow:0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 10px 0 rgba(40,54,89,.18)}
.logo .w1{color:var(--coral)} .logo .w2{color:var(--orange)} .logo .w3{color:var(--grape)}
.tagline{margin:0;font-size:clamp(20px,3.4vw,30px);font-weight:700;color:var(--ink);background:rgba(255,255,255,.75);padding:4px 22px;border-radius:999px}
.start-toys{display:flex;gap:clamp(14px,4vw,40px);align-items:flex-end;justify-content:center}
.start-toys svg{width:clamp(64px,11vw,110px);height:auto;animation:floaty 3.2s ease-in-out infinite}
.start-toys svg:nth-child(2){animation-delay:-1s}.start-toys svg:nth-child(3){animation-delay:-2s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.btn-big{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);color:#fff;background:var(--coral);
  padding:12px 54px 16px;border-radius:999px;box-shadow:0 8px 0 #D94848,0 18px 30px rgba(217,72,72,.35);transition:transform .12s,box-shadow .12s;animation:pulse 1.8s ease-in-out infinite}
.btn-big:active{transform:translateY(6px);box-shadow:0 2px 0 #D94848,0 8px 16px rgba(217,72,72,.3)}
@keyframes pulse{50%{transform:scale(1.06)}}

.kid-pick{display:flex;gap:clamp(16px,5vw,40px);justify-content:center;flex-wrap:wrap}
.kid-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);border-radius:32px;padding:14px 26px 16px;box-shadow:var(--shadow);transition:transform .15s;animation:pulse 2s ease-in-out infinite}
.kid-btn:nth-child(2){animation-delay:-1s}
.kid-btn:active{transform:scale(.95)}
.kid-btn svg{width:clamp(96px,16vw,140px);height:auto}
.kid-btn span{font-weight:800;font-size:clamp(24px,4vw,34px);color:#fff;padding:2px 24px 6px;border-radius:999px}
.kid-btn.boy span{background:var(--blue);box-shadow:0 5px 0 #2563C9}
.kid-btn.girl span{background:var(--berry);box-shadow:0 5px 0 #D9408A}
.pick-q{margin:0;font-size:clamp(22px,3.6vw,32px);font-weight:800;color:var(--ink)}
.kid-switch{display:flex;gap:8px;justify-content:center;margin:-8px 0 16px}
.kid-switch button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border-radius:999px;padding:4px 14px 4px 6px;font-weight:800;font-size:17px;color:var(--ink-soft);border:3px solid transparent}
.kid-switch button svg{width:34px;height:34px}
.kid-switch button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:var(--sun)}
.class-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.88);border-radius:24px;padding:12px 26px 14px;box-shadow:var(--shadow-sm);font-family:var(--ui)}
.class-card .school{font-family:var(--display);font-size:clamp(20px,3.2vw,26px);font-weight:800;color:var(--ink)}
.class-card .meta{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;font-size:clamp(16px,2.4vw,19px);font-weight:700;color:var(--ink-soft)}
.class-card .meta b{color:var(--grape);font-weight:800}
.start-hint{margin:0;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.7);padding:5px 14px;border-radius:999px}
/* ---------- home ---------- */
#scrHome{overflow-y:auto;padding-block:6px 24px;align-items:center}
.home-title{font-size:clamp(30px,5.4vw,56px);font-weight:800;margin:4px 0 2px;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(40,54,89,.28)}
.home-sub{margin:0 0 18px;font-size:clamp(17px,2.6vw,22px);font-weight:600;color:var(--ink);text-align:center}
.cards{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,28px)}
.card{background:var(--paper);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:center;transition:transform .2s;cursor:pointer}
.card:hover{transform:translateY(-6px) rotate(-.6deg)}
.card:active{transform:scale(.97)}
.card .art{height:clamp(150px,22vw,210px);display:grid;place-items:center;position:relative}
.card .art svg{width:72%;max-width:100%;height:90%;animation:floaty 3.4s ease-in-out infinite}
.card.letters .art{background:radial-gradient(circle at 30% 30%,#FFE3C2,#FFC48A)}
.card.colors .art{background:radial-gradient(circle at 30% 30%,#DDF3FF,#9FD8FF)}
.card.shapes .art{background:radial-gradient(circle at 30% 30%,#E6F9DA,#B5EA95)}
.card .body{padding:16px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.card h2{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:800}
.card p{margin:0 0 8px;font-size:18px;color:var(--ink-soft);font-weight:600}
.play{font-weight:800;font-size:24px;color:#fff;padding:8px 34px 11px;border-radius:999px;transition:transform .12s}
.card.letters .play{background:var(--orange);box-shadow:0 6px 0 #DB7A22}
.card.colors .play{background:var(--blue);box-shadow:0 6px 0 #2563C9}
.card.shapes .play{background:var(--leaf);box-shadow:0 6px 0 #34983F}
.card:hover .play{transform:scale(1.06)}
.home-hint{margin:18px 0 0;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.75);padding:6px 16px;border-radius:999px;display:flex;align-items:center;gap:6px}
.home-hint svg{width:18px;height:18px}
.credit{margin:10px 0 0;font-family:var(--ui);font-size:15px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);padding:6px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;text-align:center}
.credit a{display:inline-flex;align-items:center;gap:5px;color:var(--grape);text-decoration:none;font-weight:800;-webkit-user-select:text;user-select:text}
.credit a:hover{text-decoration:underline}
.credit svg{width:16px;height:16px}
#scrStart .credit{margin-top:4px}

/* ---------- game ---------- */
.qbar{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:28px;box-shadow:var(--shadow-sm);padding:8px 10px 8px 18px;flex-wrap:wrap}
.replay{width:58px;height:58px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 4px 0 #DDA51F;flex:0 0 auto}
.replay svg{width:32px;height:32px}
.replay.talking{animation:bump .6s ease infinite}
#qText{flex:1;min-width:0;font-size:clamp(26px,4.6vw,46px);font-weight:800;line-height:1.25;text-wrap:balance}
#qText .hl{color:var(--coral);text-decoration:underline wavy var(--sun) 3px;text-underline-offset:8px}
#qText.pop{animation:qpop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes qpop{from{transform:scale(.7);opacity:0}}
.progress{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-family:var(--ui);font-weight:800;font-size:18px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{width:clamp(90px,16vw,170px);height:16px;border-radius:999px;background:var(--line);overflow:hidden}
#progFill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--orange));transition:width .5s}
#stage{position:relative;flex:1;min-height:0;margin-top:10px}
.item{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;touch-action:manipulation}
.item .inner{width:100%;height:100%;animation:enter .55s cubic-bezier(.2,.9,.3,1.4) backwards}
.item .inner svg{width:100%;height:100%;overflow:visible}
.item:hover .inner{filter:brightness(1.05) drop-shadow(0 0 10px rgba(255,255,255,.9))}
@keyframes enter{from{transform:scale(0)}}
.letter .inner{border-radius:50%;background:rgba(255,255,255,.82);border:5px solid var(--lc);box-shadow:0 8px 18px rgba(40,54,89,.15),inset 0 -6px 0 rgba(40,54,89,.06);display:grid;place-items:center}
.letter .glyph{font-weight:800;color:var(--lc);line-height:1;padding-bottom:.12em;text-shadow:0 3px 0 rgba(40,54,89,.12)}
.letter .glyph.tall{padding-bottom:0;transform:translateY(.12em)}
.shape .inner svg{filter:drop-shadow(0 8px 10px rgba(40,54,89,.18))}
.balloon .inner svg{filter:drop-shadow(0 10px 10px rgba(40,54,89,.16))}
.inner.nope{animation:nope .5s ease}
@keyframes nope{15%{transform:translateX(-12px) rotate(-6deg)}35%{transform:translateX(10px) rotate(5deg)}55%{transform:translateX(-7px) rotate(-3deg)}75%{transform:translateX(4px)}}
.balloon .inner.nope{animation:boing .6s ease}
@keyframes boing{20%{transform:translateY(-18px) scale(.95,1.06)}45%{transform:translateY(4px) scale(1.08,.92)}70%{transform:translateY(-6px) scale(.98,1.02)}}
.inner.win-grow{animation:wingrow .65s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes wingrow{40%{transform:scale(1.4) rotate(-8deg)}70%{transform:scale(1.32) rotate(8deg)}100%{transform:scale(1.45) rotate(0)}}
.inner.win-spin{animation:winspin .65s cubic-bezier(.3,.8,.3,1.1) forwards}
@keyframes winspin{to{transform:scale(1.45) rotate(360deg)}}
.balloon .inner{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.balloon .inner.inflate{transform:scale(1.24,1.2)}
.item.popped{opacity:0;transition:opacity .08s}
.item.leave .inner{animation:leave .35s ease-in forwards}
@keyframes leave{to{transform:scale(0);opacity:0}}
.item.chosen{z-index:5}

#feedback{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);z-index:8;pointer-events:none;max-width:calc(100% - 20px)}
#feedback .fb{font-weight:800;text-align:center;border-radius:999px;padding:8px 30px 12px;white-space:nowrap;box-shadow:var(--shadow)}
#feedback .fb.praise{background:var(--paper);color:var(--ink);font-size:clamp(26px,5vw,48px);animation:fbin .6s cubic-bezier(.2,.9,.3,1.5)}
#feedback .fb.praise b{color:var(--coral)}
#feedback .fb.soft{background:#FFF3C9;color:#8A5A00;font-size:clamp(20px,3.4vw,30px);animation:fbsoft .45s ease}
#feedback .fb.out{animation:fbout .3s ease forwards}
@keyframes fbin{from{transform:scale(.3) rotate(-8deg);opacity:0}}
@keyframes fbsoft{from{transform:translateY(16px);opacity:0}}
@keyframes fbout{to{transform:scale(.8);opacity:0}}

#endCard{position:absolute;inset:0;display:grid;place-items:center;z-index:9}
.end-box{background:var(--paper);border-radius:38px;box-shadow:var(--shadow);padding:24px clamp(20px,5vw,48px) 30px;text-align:center;max-width:520px;width:100%;animation:fbin .6s cubic-bezier(.2,.9,.3,1.3)}
.end-box .trophy{width:130px;height:130px;margin:0 auto;animation:floaty 3s ease-in-out infinite}
.end-box h2{margin:6px 0 2px;font-size:clamp(34px,6vw,52px);font-weight:800;color:var(--coral)}
.end-box p{margin:0 0 10px;font-size:22px;font-weight:700;color:var(--ink-soft)}
.end-stars{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px 0 18px}
.end-stars svg{width:34px;height:34px;animation:enter .4s cubic-bezier(.2,.9,.3,1.5) backwards}
.end-acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:800;font-size:22px;padding:8px 26px 11px;border-radius:999px;transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 5px 0 #D94848}
.btn.ghost{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 #EAD9AE}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 #2563C9}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
.fly-star{position:fixed;left:0;top:0;width:44px;height:44px;z-index:21;pointer-events:none}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:40;background:var(--ink);color:#fff;font-family:var(--ui);font-weight:700;font-size:17px;padding:10px 20px;border-radius:16px;transition:.3s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- settings ---------- */
#settings{position:fixed;inset:0;z-index:30;background:rgba(40,54,89,.45);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#settings[hidden]{display:none!important}
.sheet{width:100%;max-width:860px;max-height:100%;background:var(--paper);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;font-family:var(--ui);animation:screenIn .35s ease;-webkit-user-select:text;user-select:text}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 8px}
.sheet-head h2{margin:0;font-family:var(--display);font-size:28px;font-weight:800}
.x-btn{width:46px;height:46px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.x-btn svg{width:22px;height:22px}
.tabs{flex:0 0 auto;display:flex;gap:6px;padding:4px 16px 12px;overflow-x:auto;border-bottom:2px solid var(--line)}
.tab{flex:0 0 auto;font-weight:800;font-size:17px;padding:9px 18px;border-radius:999px;background:var(--line);color:var(--ink-soft)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.sheet-body{overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.set-block{border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.set-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.set-head h3{margin:0;font-size:19px;font-weight:800}
.set-help{margin:4px 0 10px;color:var(--ink-soft);font-size:15px;font-weight:500;line-height:1.6}
.mini-acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--cream);border:1.5px solid #EAD9AE}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;height:52px;border-radius:16px;border:2.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:700;font-size:15px;color:var(--ink-soft);transition:.15s}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip .g{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;padding-bottom:4px}
.chip .sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(40,54,89,.25)}
.chip.on .sw{border-color:#fff}
.chip svg{width:26px;height:26px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lbl{font-weight:800;font-size:16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:14px;background:var(--line);font-size:26px;font-weight:800;line-height:1}
.stepper output{min-width:56px;text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;padding:8px 12px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(40,54,89,.15)}
.range-wrap input{width:100%;accent-color:var(--coral);height:28px}
.range-labels{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-soft)}
.note{font-size:14px;color:var(--ink-soft);font-weight:500;margin:0;line-height:1.6}
.switch{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px}
.switch .knob{width:62px;height:34px;border-radius:999px;background:#C9D3E3;position:relative;transition:.2s;flex:0 0 auto}
.switch .knob::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch[aria-checked=true] .knob{background:var(--mint)}
.switch[aria-checked=true] .knob::after{right:32px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:4px 12px;border-radius:999px}
.status.ok{background:#DDF7EE;color:#11745E}.status.warn{background:#FFF1D6;color:#8A5A00}
.sbtn{font-weight:800;font-size:15px;padding:9px 16px;border-radius:12px;background:var(--line)}
.sbtn.danger{background:#FFE2E2;color:#B42323}
.sbtn.danger.armed{background:#E03B3B;color:#fff}
.sheet-foot{flex:0 0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 20px 16px;border-top:2px solid var(--line)}
.sheet-foot .note{flex:1;min-width:200px}

.clips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.clip-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:#F6F8FC}
.clip-row.rec{background:#FFE8E8;box-shadow:inset 0 0 0 2px #E03B3B}
.clip-row .dot{width:14px;height:14px;border-radius:50%;background:#C9D3E3;flex:0 0 auto}
.clip-row .dot.on{background:var(--mint)}
.clip-row .ph{flex:1;min-width:160px;font-family:var(--display);font-size:19px;font-weight:700}
.clip-acts{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{font-weight:800;font-size:14px;padding:8px 12px;border-radius:11px;background:#fff;border:1.5px solid var(--line)}
.cbtn.recb{background:#E03B3B;color:#fff;border-color:#E03B3B}
.clip-row.rec .cbtn.recb{animation:pulse 1s ease-in-out infinite}
.cbtn.del{color:#B42323}
@media (max-width:820px){
  .cards{grid-template-columns:minmax(0,1fr);max-width:560px}
  .card{flex-direction:row;text-align:start}
  .card .art{height:auto;width:42%;min-height:150px;flex:0 0 auto}
  .card .body{align-items:flex-start;justify-content:center;flex:1;min-width:0}
  .card p{font-size:16px}
}
@media (max-width:560px){
  .round-btn{width:48px;height:48px}.round-btn svg{width:26px;height:26px}
  .stars-pill{height:48px;font-size:22px;padding-inline:10px 14px}.stars-pill svg{width:28px;height:28px}
  .bar-mid{display:none}
  .qbar{padding:8px 12px;gap:10px}
  .replay{width:50px;height:50px}
  .progress{width:100%}
  .track{flex:1}
  .fields{grid-template-columns:minmax(0,1fr)}
  .card .art{width:38%}
  .play{font-size:20px;padding:6px 24px 9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.05)},
 pop(){if(!this.ok())return;const c=this.ctx,t=c.currentTime;const s=c.createBufferSource();s.buffer=this.noise;const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1500;bp.Q.value=.7;const g=c.createGain();
  g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+.14);s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t);s.stop(t+.2);
  this.tone(190,t,.12,"sine",.7,45)},
 ding(){if(!this.ok())return;const t=this.ctx.currentTime;[[784,0],[1047,.09],[1568,.18]].forEach(([f,d])=>{this.tone(f,t+d,.38,"sine",.22);this.tone(f*2,t+d,.2,"triangle",.05)})},

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(g);g.connect(this.master);o.start(t);l.start(t);o.stop(t+.4);l.stop(t+.4)},

};

 score(v){let s=0;if(this.female(v))s+=100;if(this.male(v))s-=100;if(/natural|online|neural/i.test(v.name))s+=40;if(/google/i.test(v.name))s+=25;if(/premium|enhanced|siri/i.test(v.name))s+=30;if(/ar[-_]SA/i.test(v.lang))s+=10;return s},

  this.list=vs.filter(v=>/^ar/i.test(v.lang)).sort((a,b)=>this.score(b)-this.score(a));
  const pref=state.settings.general.voiceF;this.voice=(pref&&this.list.find(v=>v.voiceURI===pref))||this.list[0]||null;this.hasArabic=!!this.voice;if(settingsOpen&&setTab==="general")renderSettings()},

 say(text){return new Promise(res=>{const my=++this.seq;
  if(!soundOn()||!this.synth||!this.voice){setTimeout(res,900);return}
  const wasBusy=this.busy();if(wasBusy){try{this.synth.cancel()}catch(e){}}
  let done=false,started=false,t1,t2,ka;
  const fin=()=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);clearInterval(ka);if(my===this.seq)setTalking(false);res()};
  const u=new SpeechSynthesisUtterance(text);u.lang=this.voice.lang;u.voice=this.voice;
  u.rate=state.settings.general.rate==="slow"?.78:.9;u.pitch=1.05;u.volume=1;
  u.onstart=()=>{started=true;if(my===this.seq)setTalking(true);clearTimeout(t1)};
  u.onend=fin;u.onerror=fin;

   try{this.synth.resume();this.synth.speak(u)}catch(e){fin();return}

   t2=setTimeout(fin,20000);
   ka=setInterval(()=>{try{if(this.synth.speaking&&!this.synth.paused){this.synth.pause();this.synth.resume()}}catch(e){}},9000)};
  wasBusy?setTimeout(go,180):go()})}

function decodeAB(ab){return new Promise((res,rej)=>{try{const p=FX.ctx.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}})}
function abToB64(ab){const u=new Uint8Array(ab);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64ToAb(str){try{const b=atob(String(str).replace(/^data:[^,]*,/,""));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}catch(e){return null}}
function encodeWav(f,sr){const buf=new ArrayBuffer(44+f.length*2),v=new DataView(buf);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,"RIFF");v.setUint32(4,36+f.length*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,f.length*2,true);
 for(let i=0;i<f.length;i++){const x=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}return buf}
async function decodeMono(ab){FX.init();if(!FX.ctx)throw new Error("noctx");const src=await decodeAB(ab);
 const n=src.length,ch=src.numberOfChannels,mono=new Float32Array(n);
 for(let c=0;c<ch;c++){const d=src.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ch}return{mono,sr:src.sampleRate}}
async function processClip(ab){const {mono,sr}=await decodeMono(ab);return processSamples(mono,sr)}
function splitSegments(mono,sr){const fr=Math.floor(sr*.02),nf=Math.floor(mono.length/fr),rms=new Float32Array(nf);let pk=0;
 for(let f=0;f<nf;f++){let a=0;for(let i=f*fr;i<(f+1)*fr;i++)a+=mono[i]*mono[i];rms[f]=Math.sqrt(a/fr);if(rms[f]>pk)pk=rms[f]}
 const thr=Math.max(.004,pk*.06),gap=Math.round(.42/.02),segs=[];let st=-1,quiet=0;
 for(let f=0;f<nf;f++){if(rms[f]>=thr){if(st<0)st=f;quiet=0}else if(st>=0){quiet++;if(quiet>=gap){segs.push([st,f-quiet+1]);st=-1;quiet=0}}}
 if(st>=0)segs.push([st,nf-quiet]);
 const env=([a,b])=>{const e=rms.slice(a,b);const m=e.reduce((x,y)=>x+y,0)/e.length;let n=0;for(const v of e)n+=(v-m)*(v-m);return{e,m,n:Math.sqrt(n)||1}};
 const E=segs.map(env),dup=new Set();
 for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++){const A=E[i],B=E[j];if(Math.abs(A.e.length-B.e.length)>2||A.e.length<20)continue;const L=Math.min(A.e.length,B.e.length);let c=0;for(let k=0;k<L;k++)c+=(A.e[k]-A.m)*(B.e[k]-B.m);if(c/(A.n*B.n)>.99){dup.add(i);dup.add(j)}}
 const kept=dup.size?segs.filter((_,i)=>!dup.has(i)):segs;
 return kept.filter(([a,b])=>(b-a)*.02>=.15).map(([a,b])=>[Math.max(0,(a-4)*fr),Math.min(mono.length,(b+8)*fr)])}
async function processSamples(mono,sr){const n=mono.length;
 let peak=0;for(let i=0;i<n;i++){const a=Math.abs(mono[i]);if(a>peak)peak=a}if(peak<.004)throw new Error("silent");
 const thr=Math.max(.01,peak*.07);let s0=0;while(s0<n&&Math.abs(mono[s0])<thr)s0++;let e0=n-1;while(e0>s0&&Math.abs(mono[e0])<thr)e0--;
 s0=Math.max(0,s0-Math.floor(sr*.08));e0=Math.min(n,e0+Math.floor(sr*.18));const len=Math.max(1,e0-s0);
 const tmp=FX.ctx.createBuffer(1,len,sr),td=tmp.getChannelData(0),k=.9/peak,fade=Math.floor(sr*.012);
 for(let i=0;i<len;i++){let g=k;if(i<fade)g*=i/fade;if(i>len-fade)g*=(len-i)/fade;td[i]=mono[s0+i]*g}
 const OUT=22050,OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OAC(1,Math.ceil(len*OUT/sr),OUT);
 const bs=oc.createBufferSource();bs.buffer=tmp;bs.connect(oc.destination);bs.start(0);
 const out=await new Promise(r=>{oc.oncomplete=ev=>r(ev.renderedBuffer);const pr=oc.startRendering();if(pr&&pr.then)pr.then(r)});
 return encodeWav(out.getChannelData(0),OUT)}
const Clips={db:null,local:new Map(),pack:new Map(),bufs:new Map(),
 async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("funlearn-clips",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

  if(settingsOpen&&setTab==="voice")renderSettings()},

const Talk={src:null,seq:0,playing:false,

const Rec={mr:null,key:null,stream:null,chunks:[],timer:null,

async function bulkImport(sec,file){const rows=catalog().filter(c=>c.sec===sec);toast("جارٍ تقطيع الملف…",8000);
 try{const {mono,sr}=await decodeMono(await file.arrayBuffer());const segs=splitSegments(mono,sr);
  if(!segs.length){toast("لم نجد كلامًا في الملف",4000);return}
  const n=Math.min(segs.length,rows.length);
  for(let i=0;i<n;i++){const [a,b]=segs[i];Clips.put(rows[i].key,await processSamples(mono.slice(a,b),sr))}

 state.locked=true;it.frozen=true;it.vx=it.vy=0;it.el.classList.add("chosen");Talk.cancel();
 let c;
 if(it.kind==="balloon"){await wait(220);it.inner.classList.add("inflate");await wait(320);c=itemCenter(it);it.el.classList.add("popped");it.gone=true;FX.pop();P.balloon(c.x,c.y,it.data,it.w)}
 else{FX.ding();it.inner.classList.add(it.kind==="shape"?"win-spin":"win-grow");await wait(640);c=itemCenter(it);P.burst(c.x,c.y);it.el.classList.add("popped");it.gone=true}
 const PR=PRAISE(),pp=pick(PR),p=pp[0];
 const shown=r.g==="colors"?`<b>${p}</b> هذا هو اللون ${it.data.name}!`:r.g==="letters"?`<b>${p}</b> هذا حرف ${it.data.name} <span style="color:var(--blue)">${it.data.ch}</span>`:`<b>${p}</b> ${it.data.tag}!`;
 feedback(shown,"praise");
 r.earned++;
 flyStar(c.x,c.y,()=>{state.stars++;save();updateStars(true)});
 const talk=wait(200).then(()=>Talk.say([{key:GK("p:"+PR.indexOf(pp)),text:pp[1]},{key:`ok:${r.g}:${it.data.id}`,text:G.ok(it.data)}]));
 setTimeout(()=>items.forEach(o=>{if(o!==it)o.el.classList.add("leave")}),900);
 $("progFill").style.width=((r.idx+1)/r.order.length*100)+"%";
 await Promise.all([talk,wait(1900)]);await wait(250);
 if(state.round!==r)return;
 r.idx++;if(r.idx>=r.order.length)endRound();else setupQuestion()}
function onWrong(it,G,r){it.inner.classList.remove("nope","enter");void it.inner.offsetWidth;it.inner.style.animationDelay="0ms";it.inner.classList.add("nope");
 const c={x:it.x,y:it.y};items.forEach(o=>{if(o===it)return;const dx=c.x-o.x,dy=c.y-o.y,d=Math.hypot(dx,dy)||1;if(d<it.r*3){it.vx+=dx/d*it.sp*.6;it.vy+=dy/d*it.sp*.6}});
 if(it.kind==="balloon")it.vy-=it.sp*.8;
 FX.boing();const now=performance.now();
 if(now-lastWrong>1400){lastWrong=now;const sk=!Clips.has(GK("try"))&&Math.random()<.5;feedback(sk?G.seekShow(r.target):T().try,"soft");const phrase=sk?G.seek(r.target):T().trySay;setTimeout(()=>{if(state.round===r&&!state.locked&&!Talk.busy())Talk.say([{key:sk?"seek":GK("try"),text:phrase}])},340)}}
function endRound(){const r=state.round;clearStage();paused=true;$("progFill").style.width="100%";
 $("endTitle").textContent=T().endTitle;$("endText").textContent=starsPhrase(r.earned)+" في "+GAMES[r.g].title;
 const n=Math.min(r.earned,20);$("endStars").innerHTML=Array.from({length:n},(_,i)=>STAR_SVG.replace("<svg",`<svg style="animation-delay:${i*60}ms"`)).join("");
 $("endCard").hidden=false;FX.fanfare();P.rain();setTimeout(()=>{if(state.round===r)Talk.say([{key:GK("end"),text:T().endSay}])},700)}
function goHome(){Talk.cancel();stopLoop();clearStage();state.round=null;state.game=null;$("endCard").hidden=true;$("feedback").innerHTML="";show("scrStart")}

/* ================= wiring ================= */
$("startBtn").addEventListener("click",()=>{FX.init();FX.resume();FX.tap();
 if(Voice.synth){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;Voice.synth.speak(u)}catch(e){}}
 startGame("letters")});
$("homeBtn").addEventListener("click",()=>{FX.tap();goHome()});
$("soundBtn").addEventListener("click",()=>{state.settings.general.sound=!soundOn();save();updateSoundBtn();if(!soundOn())Talk.cancel();else{FX.init();FX.resume();FX.tap()}toast(soundOn()?"تم تشغيل الصوت":"تم كتم الصوت")});
$("replayBtn").addEventListener("click",()=>{FX.resume();if(state.round&&state.round.target&&!state.locked)Talk.say([{key:`q:${state.round.g}:${state.round.target.id}`,text:GAMES[state.round.g].q(state.round.target)}])});
$("againBtn").addEventListener("click",()=>{FX.tap();startGame(state.round?state.round.g:state.game)});
$("otherBtn").addEventListener("click",()=>{FX.tap();goHome()});

/* gear: long press opens settings */
const gear=$("gearBtn");let holdT=null,held=false;
gear.addEventListener("pointerdown",e=>{e.preventDefault();held=false;gear.classList.add("holding");holdT=setTimeout(()=>{held=true;holdT=null;gear.classList.remove("holding");openSettings()},900)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>gear.addEventListener(ev,()=>{if(holdT){clearTimeout(holdT);holdT=null}if(gear.classList.contains("holding")){gear.classList.remove("holding");if(ev==="pointerup"&&!held)toast("اضغط مطولًا على الترس لفتح إعدادات المعلم")}}));
gear.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSettings()}});
gear.addEventListener("contextmenu",e=>e.preventDefault());

/* ================= settings ================= */
const TABS=[["letters","الحروف"],["general","عام"]];
let studioSec="general";
function voiceTab(){const cat=catalog(),done=cat.filter(c=>Clips.has(c.key)).length,tts=state.settings.general.tts!==false;
 const row=c=>{const has=Clips.has(c.key),rec=Rec.key===c.key;return`<div class="clip-row ${rec?"rec":""}"><span class="dot ${has?"on":""}" title="${has?"مسجّلة":"غير مسجّلة"}"></span><span class="ph">${c.show}</span><div class="clip-acts">
 <button class="cbtn recb" data-act="vrec" data-key="${c.key}">${rec?"إيقاف التسجيل":has?"إعادة التسجيل":"تسجيل"}</button>
 <button class="cbtn" data-act="vup" data-key="${c.key}">رفع ملف</button>
 ${has?`<button class="cbtn" data-act="vplay" data-key="${c.key}">استماع</button><button class="cbtn del" data-act="vdel" data-key="${c.key}">حذف</button>`:""}</div></div>`};
 return`<section class="set-block"><div class="set-head"><h3>العبارات بصوتك أنتِ</h3><span class="status ${done?"ok":"warn"}">سجّلتِ ${fmt(done)} من ${fmt(cat.length)}</span></div>
 <p class="set-help">كل عبارة تسجّلينها تُستخدم بدل الصوت الآلي مباشرة. اضغطي «تسجيل» وانطقي العبارة ثم «إيقاف التسجيل». يحذف الموقع الصمت من البداية والنهاية ويضبط ارتفاع الصوت تلقائيًا. ويمكنك بدلًا من ذلك رفع ملف صوتي سجّلتِه بالجوال.</p>
 <div class="row"><button class="switch" role="switch" aria-checked="${tts}" data-act="tts"><span class="knob"></span>${tts?"الصوت الآلي يكمل العبارات غير المسجّلة":"العبارات غير المسجّلة بلا صوت"}</button></div></section>
 <section class="set-block"><div class="seg">${[["general","الترحيب والتشجيع"],["letters","الحروف"],["colors","الألوان"],["shapes","الأشكال"]].map(([k,t])=>`<button data-act="vsec" data-val="${k}" aria-pressed="${studioSec===k}">${t}</button>`).join("")}</div>
 <div class="bulk"><p class="set-help" style="margin:12px 0 8px"><b>أسرع طريقة:</b> انسخي النص، والصقيه في موقع النطق الذي تفضّلينه واختاري نفس الصوت، ثم نزّلي الملف الصوتي وارفعيه هنا. يقطّع الموقع الملف عند الوقفات ويضع كل عبارة في مكانها بالترتيب.</p>
 <div class="row"><button class="sbtn" data-act="vcopy">نسخ نص هذا القسم</button><button class="sbtn" data-act="vbulk" style="background:var(--ink);color:#fff">رفع الملف الصوتي الكامل</button></div>
 <textarea id="scriptBox" readonly rows="4" style="width:100%;margin-top:10px;font:inherit;font-size:15px;line-height:1.8;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);resize:vertical">${cat.filter(c=>c.sec===studioSec).map(c=>c.say).join("\n")}</textarea></div>
 <div class="clips">${cat.filter(c=>c.sec===studioSec).map(row).join("")}</div></section>
 <section class="set-block"><div class="set-head"><h3>نقل التسجيلات إلى أجهزة الطالبات</h3></div>
 <p class="set-help">التسجيلات تُحفظ على هذا الجهاز. لتسمعها الطالبات على أجهزتهن: صدّري الحزمة، ثم ارفعي ملف voices.json في نفس المستودع بجانب ملف الموقع، فيشغّله الموقع تلقائيًا لكل من يفتحه. ويمكن أيضًا استيراد الحزمة يدويًا على أي جهاز.</p>
 <div class="row"><button class="sbtn" data-act="vexport">تصدير حزمة الأصوات</button><button class="sbtn" data-act="vimport">استيراد حزمة</button><button class="sbtn danger ${armed==="clips"?"armed":""}" data-act="vclear">${armed==="clips"?"اضغط مرة أخرى للتأكيد":"حذف كل التسجيلات"}</button></div></section>`}
function openSettings(){settingsOpen=true;dirty=false;paused=true;Talk.cancel();setTab=setTab==="general"?"general":"letters";if(setTab==="general"&&state.game)setTab=state.game;$("settings").hidden=false;renderSettings();$("setClose").focus()}
function closeSettings(){Rec.stop();settingsOpen=false;$("settings").hidden=true;armed=null;
 if(state.screen==="scrGame"&&state.round){if(dirty&&$("endCard").hidden){startGame(state.round.g)}else if($("endCard").hidden){paused=false}}}
$("setClose").addEventListener("click",closeSettings);$("setDone").addEventListener("click",closeSettings);
$("settings").addEventListener("pointerdown",e=>{if(e.target.id==="settings")closeSettings()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&settingsOpen)closeSettings()});
function chipFace(g,it){if(g==="letters")return`<span class="g">${it.ch}</span>`;if(g==="colors")return`<span class="sw" style="background:${it.hex}"></span><span>${it.name}</span>`;return`${shapeSVG(it,"#8E5BD8").replace(/<g transform[\s\S]*?<\/g><\/svg>/,"</svg>")}<span>${it.name}</span>`}
function stepper(field,label,v){return`<div class="field"><span class="lbl">${label}</span><div class="stepper"><button data-act="step" data-field="${field}" data-d="-1" aria-label="إنقاص">−</button><output>${fmt(v)}</output><button data-act="step" data-field="${field}" data-d="1" aria-label="زيادة">+</button></div></div>`}
function seg(field,label,opts,cur){return`<div class="field"><span class="lbl">${label}</span><div class="seg">${opts.map(([v,t])=>`<button data-act="seg" data-field="${field}" data-val="${v}" aria-pressed="${cur===v}">${t}</button>`).join("")}</div></div>`}
function gameTab(g){const G=GAMES[g],s=state.settings[g];const tLabel={letters:"الحروف المطلوبة",colors:"الألوان المطلوبة",shapes:"الأشكال المطلوبة"}[g];
 const cnt={letters:"عدد الحروف على الشاشة",colors:"عدد البالونات",shapes:"عدد الأشكال على الشاشة"}[g];
 let h=`<section class="set-block"><div class="set-head"><h3>${tLabel}</h3><div class="mini-acts">${PRESETS[g].map((p,i)=>`<button class="mini" data-act="preset" data-i="${i}">${p[0]}</button>`).join("")}</div></div>
 <p class="set-help">العناصر التي يُسأل الطفل عنها في هذه الجولة (${fmt(s.targets.length)} مختارة).</p>
 <div class="chips">${G.items.map(it=>`<button class="chip ${s.targets.includes(it.id)?"on":""}" data-act="tog-t" data-id="${it.id}" aria-pressed="${s.targets.includes(it.id)}" aria-label="${it.name}">${chipFace(g,it)}</button>`).join("")}</div></section>
 <section class="set-block"><div class="set-head"><h3>عناصر التشتيت</h3><div class="mini-acts"><button class="mini" data-act="dis-all">الكل</button><button class="mini" data-act="dis-same">مثل المطلوبة</button><button class="mini" data-act="dis-none">لا شيء</button></div></div>
 <p class="set-help">العناصر الأخرى التي تظهر بجانب الإجابة الصحيحة. إذا لم تختر شيئًا تُستخدم بقية العناصر المطلوبة. الإجابة الصحيحة تظهر دائمًا مرة واحدة فقط.</p>
 <div class="chips">${G.items.map(it=>`<button class="chip ${s.distractors.includes(it.id)?"on":""}" data-act="tog-d" data-id="${it.id}" aria-pressed="${s.distractors.includes(it.id)}" aria-label="${it.name}">${chipFace(g,it)}</button>`).join("")}</div></section>
 <section class="set-block"><div class="fields">${stepper("questions","عدد الأسئلة",s.questions)}${stepper("count",cnt,s.count)}
 <div class="field range-wrap"><label for="spd-${g}">سرعة الحركة: ${SPEED_LBL[s.speed]}</label><input type="range" id="spd-${g}" min="1" max="5" step="1" value="${s.speed}" data-range="speed"><div class="range-labels"><span>بطيئة</span><span>سريعة</span></div></div>`;
 if(g==="letters")h+=seg("difficulty","مستوى الصعوبة",[["easy","سهل"],["medium","متوسط"],["hard","صعب"]],s.difficulty)+`<p class="note" style="grid-column:1/-1">سهل: حروف التشتيت مختلفة الشكل عن المطلوب. صعب: تظهر الحروف المتشابهة معًا مثل ب ت ث، ج ح خ.</p>`;
 if(g==="shapes"){h+=seg("colorMode","ألوان الأشكال",[["multi","ألوان متنوعة"],["single","لون واحد"]],s.colorMode);
  if(s.colorMode==="single")h+=`<div class="field" style="grid-column:1/-1"><span class="lbl">اختاري اللون</span><div class="chips">${SHAPE_COLORS.map(c=>`<button class="chip ${s.color===c?"on":""}" data-act="scol" data-val="${c}" aria-pressed="${s.color===c}" aria-label="لون"><span class="sw" style="background:${c}"></span></button>`).join("")}</div></div>`}
 h+=`</div></section><div class="row"><button class="btn primary" data-act="start">ابدأ ${G.title} الآن</button></div>`;return h}
function generalTab(){const gs=state.settings.general;const v=Voice.synth?(Voice.hasArabic?`<span class="status ok">يوجد صوت عربي في هذا المتصفح</span>`:`<span class="status warn">لا يوجد صوت عربي في هذا المتصفح، لذلك أُوقف النطق حتى لا يُقرأ الكلام خطأً، وتبقى المؤثرات والأسئلة المكتوبة. جرّبي متصفح إيدج أو كروم</span>`):`<span class="status warn">هذا المتصفح لا يدعم النطق؛ تبقى المؤثرات والأسئلة المكتوبة</span>`;
 return`<section class="set-block"><div class="set-head"><h3>الصوت</h3></div>
 <div class="row" style="margin-top:10px"><button class="switch" role="switch" aria-checked="${gs.sound}" data-act="sound"><span class="knob"></span>${gs.sound?"الأصوات مُفعّلة":"الأصوات مكتومة"}</button></div>
 <div class="fields" style="margin-top:14px">${seg("rate","سرعة النطق",[["slow","هادئة"],["normal","عادية"]],gs.rate)}
 <div class="field"><span class="lbl">النطق العربي</span><div class="row">${v}<button class="sbtn" data-act="vtest">جرّب الصوت</button></div></div>
 ${Voice.list.length>1?`<div class="field" style="grid-column:1/-1"><label for="voiceSel">اختر الصوت</label><select id="voiceSel" style="font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);max-width:100%">${Voice.list.map(x=>`<option value="${x.voiceURI.replace(/"/g,"&quot;")}" ${Voice.voice&&x.voiceURI===Voice.voice.voiceURI?"selected":""}>${Voice.female(x)?"صوت أنثى — ":Voice.male(x)?"صوت ذكر — ":""}${x.name}</option>`).join("")}</select></div>`:""}</div>
 <p class="note" style="margin-top:10px">الأوضح غالبًا: الأصوات التي في اسمها Natural أو Online في متصفح إيدج، ثم صوت Google العربية في كروم، ثم الصوت العربي في أجهزة آبل.</p></section>
 <section class="set-block"><div class="set-head"><h3>النجوم والإعادة</h3></div>
 <p class="set-help">رصيد النجوم الحالي: ${fmt(state.stars)}</p>
 <div class="row"><button class="sbtn danger ${armed==="stars"?"armed":""}" data-act="reset-stars">${armed==="stars"?"اضغط مرة أخرى للتأكيد":"تصفير النجوم"}</button>
 <button class="sbtn danger ${armed==="settings"?"armed":""}" data-act="reset-settings">${armed==="settings"?"اضغط مرة أخرى للتأكيد":"إعادة الإعدادات الافتراضية"}</button></div></section>`}
function renderSettings(){const tabs=$("setTabs");tabs.innerHTML=TABS.map(([k,t])=>`<button class="tab" role="tab" aria-selected="${setTab===k}" data-tab="${k}">${t}</button>`).join("");
 const body=$("setBody"),st=body.scrollTop;body.innerHTML=setTab==="general"?generalTab():setTab==="voice"?voiceTab():gameTab(setTab);body.scrollTop=st;
 $("setNote").textContent=dirty&&state.screen==="scrGame"&&state.round?"ستبدأ جولة جديدة بالإعدادات الجديدة عند الإغلاق.":"تُحفظ التغييرات تلقائيًا على هذا الجهاز."}
$("setTabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;setTab=b.dataset.tab;armed=null;$("setBody").scrollTop=0;renderSettings()});
function changed(){dirty=true;save();renderSettings()}
$("setBody").addEventListener("input",e=>{const r=e.target.closest("[data-range]");if(!r)return;state.settings[setTab].speed=+r.value;dirty=true;save();const lbl=r.parentElement.querySelector("label");if(lbl)lbl.textContent="سرعة الحركة: "+SPEED_LBL[+r.value]});
$("setBody").addEventListener("change",e=>{if(e.target.id==="voiceSel"){state.settings.general.voiceF=e.target.value;save();Voice.pickVoice();FX.init();FX.resume();Voice.say("أَهْلًا! أَيْنَ حَرْفُ الْبَاء؟");return}if(e.target.closest("[data-range]"))renderSettings()});
$("setBody").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,g=setTab,s=state.settings[g];
 if(a==="vrec"){Rec.start(b.dataset.key);return}
 if(a==="vup"){const fi=$("clipFile");fi.dataset.key=b.dataset.key;fi.click();return}
 if(a==="vplay"){FX.init();FX.resume();Talk.say([{key:b.dataset.key}]);return}
 if(a==="vdel"){Clips.del(b.dataset.key);renderSettings();return}
 if(a==="vbulk"){$("bulkFile").click();return}
 if(a==="vcopy"){const ta=$("scriptBox");const txt=ta.value;const fb=()=>{ta.focus();ta.select();toast("النص محدد، انسخيه من القائمة")};try{navigator.clipboard.writeText(txt).then(()=>toast("تم نسخ النص، كل عبارة في سطر"),fb)}catch(err){fb()}return}
 if(a==="vsec"){studioSec=b.dataset.val;renderSettings();return}
 if(a==="tts"){state.settings.general.tts=state.settings.general.tts===false;save();renderSettings();return}
 if(a==="vexport"){exportPack();return}
 if(a==="vimport"){$("packFile").click();return}
 if(a==="vclear"){clearTimeout(armT);if(armed!=="clips"){armed="clips";armT=setTimeout(()=>{armed=null;if(settingsOpen&&setTab==="voice")renderSettings()},3500);renderSettings();return}armed=null;Clips.clear();toast("تم حذف التسجيلات المحفوظة على هذا الجهاز");renderSettings();return}
 if(a==="tog-t"){const id=b.dataset.id,i=s.targets.indexOf(id);if(i>=0){if(s.targets.length===1){toast("اختر عنصرًا واحدًا على الأقل");return}s.targets.splice(i,1)}else s.targets.push(id);changed()}
 else if(a==="tog-d"){const id=b.dataset.id,i=s.distractors.indexOf(id);i>=0?s.distractors.splice(i,1):s.distractors.push(id);changed()}
 else if(a==="preset"){s.targets=PRESETS[g][+b.dataset.i][1].slice();changed()}
 else if(a==="dis-all"){s.distractors=GAMES[g].items.map(i=>i.id);changed()}
 else if(a==="dis-same"){s.distractors=s.targets.slice();changed()}
 else if(a==="dis-none"){s.distractors=[];changed()}
 else if(a==="step"){const f=b.dataset.field,d=+b.dataset.d;const lim=f==="questions"?[3,30]:[3,GAMES[g].maxCount];s[f]=clamp(s[f]+d,lim[0],lim[1]);changed()}
 else if(a==="seg"){const f=b.dataset.field;if(g==="general"){state.settings.general[f]=b.dataset.val;}else s[f]=b.dataset.val;changed()}
 else if(a==="scol"){s.color=b.dataset.val;changed()}
 else if(a==="start"){settingsOpen=false;$("settings").hidden=true;FX.init();FX.resume();startGame(g)}
 else if(a==="sound"){state.settings.general.sound=!soundOn();save();updateSoundBtn();if(soundOn()){FX.init();FX.resume()}else Talk.cancel();renderSettings()}
 else if(a==="vtest"){FX.init();FX.resume();if(!soundOn())toast("الصوت مكتوم حاليًا");Voice.say("أَيْنَ حَرْفُ الْبَاء؟ أَحْسَنْتَ، هَذَا هُوَ اللَّوْنُ الْأَبْيَض")}
 else if(a==="reset-stars"||a==="reset-settings"){const key=a==="reset-stars"?"stars":"settings";clearTimeout(armT);
  if(armed!==key){armed=key;armT=setTimeout(()=>{armed=null;if(settingsOpen&&setTab==="general")renderSettings()},3500);renderSettings();return}
  armed=null;if(key==="stars"){state.stars=0;updateStars(true);save();toast("تم تصفير النجوم")}else{const keepSound=state.settings.general.sound;state.settings=defaults();state.settings.general.sound=keepSound;dirty=true;save();updateSoundBtn();toast("عادت الإعدادات الافتراضية")}renderSettings()}
});
Clips.init();
})();
</script>
